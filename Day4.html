//Program which gives a birthday invitation
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Party Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            border: 2px solid #ff6f61;
        }
        h1 {
            color: #ff6f61;
            margin-bottom: 10px;
        }
        p {
            color: #555555;
            line-height: 1.6;
        }
        .details {
            background-color: #ffeae6;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff6f61;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 You're Invited! 🎂</h1>
        <p>Come celebrate <strong>Alex's 25th Birthday</strong> with us! Expect food, drinks, and lots of fun.</p>
        
        <div class="details">
            <p>📅 <strong>Date:</strong> Saturday, October 24</p>
            <p>⏰ <strong>Time:</strong> 6:00 PM</p>
            <p>📍 <strong>Location:</strong> 123 Party Lane, Fun City</p>
        </div>

        <a href="mailto:alex@example.com?subject=RSVP%20for%20Birthday%20Party" class="btn">RSVP Now</a>
    </div>

</body>
</html>
